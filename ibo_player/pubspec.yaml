name: ibo_player
description: "Cross-platform IPTV player client (Xtream Codes + M3U) — clean-room Flutter recreation."
publish_to: 'none'

version: 1.0.4+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.4
  crypto: ^3.0.7
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_spinkit: ^5.2.2
  flutter_staggered_grid_view: ^0.7.0
  font_awesome_flutter: ^11.0.0
  get_it: ^9.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  media_kit: ^1.2.6
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/branding/
    - assets/languages/
